<script>
const D = __DATA__;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- language (D62): Italian and English. Japanese card names and sets always stay as printed. ----
   The words of the product live in GLOSSARY: change a term there and it changes everywhere. */
let LANG = (() => { let s = null; try { s = localStorage.getItem("sw-lang"); } catch (e) {}
  return s === "it" || s === "en" ? s : /^it\b/i.test(navigator.language || "it") ? "it" : "en"; })();
const tx = (it, en) => LANG === "it" ? it : en;
const GLOSSARY = {
  market: ["Mercato", "Market"], eras: ["Le ere", "Eras"], featured: ["In evidenza", "Featured"], catalog: ["Catalogo", "Catalogue"],
  japan: ["Giappone", "Japan"], week: ["Settimana", "This week"], deals: ["Occasioni", "Deals"], method: ["Metodo", "Method"],
  requests: ["Richieste", "Requests"], mine: ["Le mie carte", "My cards"], mine_short: ["Mie", "Mine"],
  card: ["carta gradata", "graded card"], cards: ["carte gradate", "graded cards"],
  range: ["SlabRange", "SlabRange"], range80: ["SlabRange", "SlabRange"],
  deal: ["occasione", "deal"], intro: ["SBAM!", "BAM!"], poses_link: ["Pose del personaggio", "Character poses"],
  tier_hi: ["Affidabilità alta", "High confidence"], tier_mid: ["Affidabilità media", "Medium confidence"], tier_lo: ["Affidabilità bassa", "Low confidence"],
};
const UI = {   // labels of the fixed page parts (data-i / data-ia)
  a_nav: ["Navigazione", "Navigation"], a_brand: ["Slabwise, mercato", "Slabwise, market"], a_secs: ["Sezioni", "Sections"],
  search_ph: ["Cerca una carta o un cert  ( / )", "Search a card or a cert  ( / )"], search_aria: ["Cerca una carta o un numero di cert PSA", "Search a card or a PSA cert number"],
  a_week: ["Storie della settimana", "Stories of the week"], a_lang: ["Lingua: italiano / English", "Language: italiano / English"],
  a_theme: ["Cambia tema", "Switch theme"],
  privacy_link: ["Privacy", "Privacy"], terms_link: ["Condizioni d'uso", "Terms of use"], contact_link: ["Contatti", "Contact"],
  foot_build: ["Slabwise · valori di carte Pokémon gradate PSA · ", "Slabwise · values of PSA-graded Pokémon cards · "],
};
const t = k => { const e = GLOSSARY[k] || UI[k]; return e ? e[LANG === "it" ? 0 : 1] : k; };
let LOC, nf0, nf1;
function setLocale() {
  LOC = LANG === "it" ? "it-IT" : "en-US";
  nf0 = new Intl.NumberFormat(LOC, {maximumFractionDigits: 0});
  nf1 = new Intl.NumberFormat(LOC, {maximumFractionDigits: 1, minimumFractionDigits: 1});
  document.documentElement.lang = LANG;
}
setLocale();
const usd = v => "$" + nf0.format(v);
const usdK = v => v >= 1e9 ? "$" + nf1.format(v / 1e9) + tx(" mld", "B") : v >= 1e6 ? "$" + nf1.format(v / 1e6) + tx(" mln", "M") : usd(v);
const eur = v => tx(nf0.format(v) + " €", "€" + nf0.format(v));
const pct = (v, s = true) => v == null || !isFinite(v) ? "—" : (s && v > 0 ? "+" : v < 0 ? "−" : "") + nf1.format(Math.abs(v * 100)) + "%";   // "—": a card too new for that span
const dateF = s => new Date(s + "T12:00:00").toLocaleDateString(LOC, {day: "numeric", month: "short", year: "2-digit"});
const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
/* data strings are written by the engine in Italian: shown as they are in Italian, translated here in English */
const SERIES_EN = {"Giappone": "Japan", "Vintage": "Vintage", "Classica": "Classic", "Di mezzo": "Mid era", "Moderna": "Modern", "Contemporanea": "Contemporary", "Altro": "Other"};   /* D154: the five eras of the market */
const VENUE_EN = {"Casa d'aste": "Auction house", "Prezzo fisso": "Fixed price"};
const REASON_EN = {
  "molto sotto il valore: possibile carta rovinata, falso o voto sbagliato": "far below the value: possibly a damaged card, a fake or a wrong grade",
  "molto sopra il valore: possibile lotto, asta gonfiata o Best Offer": "far above the value: possibly a lot, an inflated auction or a Best Offer",
  "Best Offer senza prezzo accettato": "Best Offer with no accepted price", "pagamento in attesa": "payment pending",
  "lotto non pagato": "unpaid lot", "sparito dall'archivio Fanatics": "removed from the Fanatics archive",
  "duplicato (stesso cert, altra fonte)": "duplicate (same cert, another source)", "duplicato (stesso annuncio)": "duplicate (same listing)",
  "doppione tra ricerche": "duplicate between searches", "lotto di più carte": "lot of several cards", "non venduta": "not sold",
  "prezzo mancante": "missing price", "prezzo o data mancanti": "missing price or date", "valuta non USD": "currency not USD",
  "altro grader": "another grading company", "non PSA 7-10": "not PSA 7–10", "cert: stampa diversa dal catalogo": "cert: different printing from the catalogue",
  "cert: voto fuori perimetro": "cert: grade out of scope", "nessuna carta del catalogo": "no catalogue card",
  "esclusa (lotto, sigillato, firmata, altro grader...)": "excluded (lot, sealed, signed, other grader…)",
  "esclusa (lingua, lotto, sigillato, firmata, ristampa...)": "excluded (language, lot, sealed, signed, reprint…)",
};
const ser = s => LANG === "en" ? SERIES_EN[s] || s : s;
const ven = s => LANG === "en" ? VENUE_EN[s] || s : s;
const rsn = s => s && LANG === "en" ? REASON_EN[s] || s : s;
const ori = o => LANG === "en" ? ({UE: "EU", USA: "US"})[o] || o : o;

const halfw = g => (g.hi - g.lo) / 2 / g.value;
const cardById = Object.fromEntries(D.cards.map(c => [c.id, c]));
const gradeOf = (c, g) => c.grades.find(x => x.grade === g);
const capOf = c => D.real ? shown(c.grades[0]) : c.grades.reduce((s, g) => s + g.value * g.pop, 0);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!reduce) document.documentElement.classList.add("mo");
let firstLoad = true;

function applyStatic() {
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll("[data-ia]").forEach(el => el.dataset.ia.split(";").forEach(p => { const [a, k] = p.split(":"); el.setAttribute(a, t(k)); }));
  document.querySelectorAll("#lang [data-l]").forEach(s => s.classList.toggle("on", s.dataset.l === LANG));
  $("#foot").textContent = (D.real ? tx(`Vendite al ${dateF(D.asof)} · ${nf0.format(D.n_sales)} vendite`, `Sales as of ${dateF(D.asof)} · ${nf0.format(D.n_sales)} sales`)
    : tx("Dati dimostrativi al ", "Demo data as of ") + dateF(D.asof)) + tx(" · carte e immagini TCGdex", " · cards and images TCGdex");
}
applyStatic();
$("#lang").onclick = () => {
  LANG = LANG === "it" ? "en" : "it";
  try { localStorage.setItem("sw-lang", LANG); } catch (e) {}
  setLocale(); applyStatic();
  const y = scrollY; route(); scrollTo({top: y});
  window.dispatchEvent(new CustomEvent("slabwise:lang", {detail: LANG}));
};

(function () {
  let th = null; try { th = localStorage.getItem("sw-theme"); } catch (e) {}
  if (th) document.documentElement.dataset.theme = th;
  $("#theme").onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const nx = cur === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = nx;
    try { localStorage.setItem("sw-theme", nx); } catch (e) {}
  };
})();
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("on"), 2200); }

/* doodles: tiny hand-drawn-style marks per era (keyed by the engine's series names) */
const DOODLE = {
  "Vintage": `<svg class="doodle" viewBox="0 0 84 84"><path d="M42 8l9 22 24 2-18 15 6 23-21-13-21 13 6-23L9 32l24-2z" fill="var(--sun)" stroke="var(--edge)" stroke-width="3" stroke-linejoin="round"/></svg>`,
  "Classica": `<svg class="doodle" viewBox="0 0 84 84"><path d="M48 6L18 46h20l-6 32 32-42H44z" fill="var(--brand)" stroke="var(--edge)" stroke-width="3" stroke-linejoin="round"/></svg>`,
  "Di mezzo": `<svg class="doodle" viewBox="0 0 84 84"><path d="M42 8l30 34-30 34-30-34z" fill="var(--sun)" stroke="var(--edge)" stroke-width="3"/></svg>`,
  "Moderna": `<svg class="doodle" viewBox="0 0 84 84"><path d="M42 10l26 10v20c0 18-12 28-26 34C28 68 16 58 16 40V20z" fill="var(--sky)" stroke="var(--edge)" stroke-width="3" stroke-linejoin="round"/></svg>`,
  "Contemporanea": `<svg class="doodle" viewBox="0 0 84 84"><circle cx="42" cy="42" r="30" fill="var(--coral)" stroke="var(--edge)" stroke-width="3"/><path d="M12 42h60" stroke="var(--edge)" stroke-width="3"/><circle cx="42" cy="42" r="9" fill="#fff" stroke="var(--edge)" stroke-width="3"/></svg>`,
};

/* components */
function slab(c, g, w = 300, cls = "") {
  return `<div class="stage"><div class="slab ${cls}" style="--w:${w}px" data-tilt>
    <div class="lab"><div style="min-width:0"><div class="l1">${esc(c.name)}</div><div class="l2">${esc(c.set)} · #${esc(c.no)}${c.tot ? "/" + c.tot : ""}</div><div class="l3">SLABWISE · ${esc(c.id.toUpperCase())}</div></div>
      <div class="gr">${g === "JP" ? `<b>${tx("STAMPA", "PRINT")}</b><strong>JP</strong>` : `<b>PSA</b><strong>${g}</strong>`}</div></div>
    <div class="win">${c.img ? `<img src="${c.img}" alt="${esc(c.name)}, ${esc(c.set)}">` : `<div class="noimg">${tx("Immagine in arrivo", "Image coming soon")}</div>`}<div class="holo"></div><div class="glare"></div></div>
  </div></div>`;
}
/* the value range bar: the signature of Slabwise (P10) */
function fork(g, mini = false, span = 0.25) {
  const pos = v => 50 + 50 * Math.log(v / g.value) / Math.log(1 + span);
  const a = Math.max(0, pos(g.lo)), b = Math.min(100, pos(g.hi));
  return `<div class="fork${mini ? " mini" : ""}" role="img" aria-label="${tx(`Slabprice ${usd(g.value)}, SlabRange da ${usd(g.lo)} a ${usd(g.hi)}`, `Slabprice ${usd(g.value)}, SlabRange from ${usd(g.lo)} to ${usd(g.hi)}`)}">
    <div class="track"><div class="band" style="left:${a}%;width:${b - a}%"></div><div class="pin" style="left:50%"></div></div>
    ${mini ? "" : `<div class="ends"><span>${usd(g.lo)}</span><span>${tx("80% di probabilità che il valore sia qui", "80% likely to be in this range")}</span><span>${usd(g.hi)}</span></div>`}</div>`;
}
/* confidence tier of a value (D47); the engine names them "Vendite fresche", "Stimato", "Poco sicuro" */
const TIER_KEY = {"Vendite fresche": "hi", "Stimato": "mid", "Poco sicuro": "lo"};
const TIER_CLS = {hi: "t-live", mid: "t-mod", lo: "t-low"};
const TIER_WHY = {hi: ["almeno 3 vendite nelle ultime 13 settimane e intervallo stretto", "at least 3 sales in the last 13 weeks and a narrow range"],
  mid: ["poche vendite recenti: il valore viene soprattutto dal modello", "few recent sales: the value comes mostly from the model"],
  lo: ["quasi nessuna vendita recente: prendilo come un'indicazione", "almost no recent sales: take it as a rough guide"]};
const tierK = g => TIER_KEY[g.tier];
/* D66: a grade with no sale of its own gets no published value: the grade ladder is not reliable enough there (D65) */
const noOwn = g => !!(D.real && g && (g.sales_all === 0 || g.off));     // D66: no own sales; D98: estimate far from its own recent sales
const shown = g => noOwn(g) ? 0 : g.value;                                // D66: a hidden value never ranks or shows
const usdV = g => noOwn(g) ? "—" : usd(g.value);
const noEst = (grade, g) => g && g.off
  ? tx(`PSA ${grade}: stima in revisione, le ultime vendite (mediana ${usd(g.med90)}) non tornano con il modello`, `PSA ${grade}: estimate under review, recent sales (median ${usd(g.med90)}) disagree with the model`)
  : tx(`Nessuna vendita in PSA ${grade}: stima non disponibile`, `No PSA ${grade} sales: no estimate`);
/* D115: what a grade without its own sales shows instead of a number: the nearest grades with real sales and how rare it is */
const monthF = s => new Date(s + "T12:00:00").toLocaleDateString(LOC, {month: "long", year: "numeric"});
const firstSale = c => c.sales.length ? c.sales.reduce((a, s) => s.date < a ? s.date : a, c.sales[0].date) : new Date().toISOString().slice(0, 10);
const refBlock = (c, g) => {
  const near = c.grades.filter(x => x.grade !== g.grade && !noOwn(x)).sort((a, b) => Math.abs(a.grade - g.grade) - Math.abs(b.grade - g.grade) || b.grade - a.grade).slice(0, 2);
  const last = g.last ? {date: g.last[0], price: g.last[1], venue: g.last[2]} : [...c.sales].filter(s => s.grade === g.grade).pop();
  const up = near.find(x => x.grade < g.grade);
  const rare = up && g.pop && up.pop ? tx(`In PSA ${g.grade} ci sono ${nf0.format(g.pop)} gradaggi contro ${nf0.format(up.pop)} in PSA ${up.grade}: circa 1 ogni ${nf0.format(Math.max(1, Math.round(up.pop / g.pop)))}. Con così pochi esemplari il prezzo lo fa la singola vendita.`, `PSA ${g.grade} has ${nf0.format(g.pop)} gradings against ${nf0.format(up.pop)} in PSA ${up.grade}: about 1 in ${nf0.format(Math.max(1, Math.round(up.pop / g.pop)))}. With so few copies a single sale sets the price.`) : "";
  return `<div class="refbox">${last ? `<div class="fact"><span>${tx("Ultima vendita nota", "Last known sale")}</span><b>${usd(last.price)}</b><em class="note">${dateF(last.date)} · ${esc(ven(last.venue))}</em></div>` : ""}
    ${near.map(x => `<button class="fact" data-cg="${x.grade}" type="button"><span>${tx("Riferimento", "Reference")} PSA ${x.grade}</span><b>${usd(x.value)}</b><em class="note">${x.sales_all} ${tx("vendite vere", "real sales")}</em></button>`).join("")}</div>
    ${rare ? `<p class="note">${rare}</p>` : ""}`;
};
const tierName = g => t("tier_" + tierK(g));
const tierWhy = g => TIER_WHY[tierK(g)][LANG === "it" ? 0 : 1];
const STK = D.stickers || {};                               // D191: the reliability stickers, when drawn
const tierBadge = g => !g.tier ? "" : STK[tierK(g)] ? `<img class="tiersticker" src="${STK[tierK(g)]}" alt="${esc(tierName(g))}" title="${esc(tierName(g) + ": " + tierWhy(g))}">`
  : `<span class="tierbadge ${TIER_CLS[tierK(g)]}" title="${esc(tierWhy(g))}">${esc(tierName(g))}</span>`;
const probTag = p => `<span class="prob ${p >= 0.8 ? "hi" : p >= 0.4 ? "mid" : "lo"}">${Math.round(p * 100)}%</span>`;
function ring(p) {
  const r = 30, C = 2 * Math.PI * r, col = p >= 0.8 ? "var(--mint)" : p >= 0.4 ? "var(--sun)" : "var(--line)";
  return `<div class="ring" role="img" aria-label="${tx("Probabilità di occasione", "Deal probability")} ${Math.round(p * 100)}%"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="${r}"/><circle class="f" cx="36" cy="36" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${reduce ? C * (1 - p) : C}" data-off="${C * (1 - p)}"/></svg><b>${Math.round(p * 100)}%</b></div>`;
}
function receipt(d) {
  return `<div class="receipt">
    <div><span>${tx("Prezzo", "Price")} (${ori(d.origin)})</span><b>${eur(d.price_eur)}</b></div>
    <div><span>${tx("Spedizione", "Shipping")}</span><b>${eur(d.ship_eur)}</b></div>
    ${d.origin === "UE" ? `<div><span>${tx("IVA e dogana", "VAT and customs")}</span><b>${tx("niente (UE)", "none (EU)")}</b></div>` : `<div><span>${tx("IVA import 22%", "Import VAT 22%")}</span><b>${eur(d.vat_eur)}</b></div><div><span>${tx("Sdoganamento", "Customs clearance")}</span><b>${eur(d.fee_eur)}</b></div>`}
    <div class="tot"><span>${tx("Ti costa in Italia", "Landed cost in Italy")}</span><b>${eur(d.landed_eur)}</b></div>
    <div><span>${tx("Vale sul mercato", "Market value")}</span><b>${eur(d.value_eur)}</b></div>
    ${resale(d)}</div>`;
}
/* D119: what is left if you sell it again, before you buy. A private seller in Italy pays no eBay.it fee for buyers in the
   eurozone (from 1 September 2026); a business seller pays about 13%. Insured tracked shipping to the buyer: about 10 EUR. */
const RESALE = {ship_eur: 10, pro_fee: 0.1325, pro_fixed_eur: 0.4};
function resale(d) {
  const priv = d.value_eur - RESALE.ship_eur, pro = d.value_eur * (1 - RESALE.pro_fee) - RESALE.pro_fixed_eur - RESALE.ship_eur;
  const row = (label, net) => { const m = net - d.landed_eur;
    return `<div><span>${label}</span><b class="${m >= 0 ? "up" : "down"}">${m >= 0 ? "+" : "−"}${eur(Math.abs(m))}</b></div>`; };
  return `<div class="resale"><span class="note">${tx("Se la rivendi al valore di mercato, ti resta", "If you resell it at market value, you keep")}</span>
    ${row(tx("da privato su eBay.it", "as a private seller on eBay.it"), priv)}
    ${row(tx("da professionista (~13%)", "as a business seller (~13%)"), pro)}
    <span class="note">${tx("Tolta la spedizione assicurata al compratore (~10 €). In Italia il prezzo di rivendita può essere diverso dal mercato USA.", "After insured shipping to the buyer (~10 €). In Italy the resale price may differ from the US market.")}</span></div>`;
}
/* real listings (D72): shown only while fresh (6 hours, eBay licence §8.1) and only when p_deal >= 0.5 */
const DEAL_TTL = 6 * 3600 * 1000;
const dealsLive = () => !D.real || (D.deals_asof && Date.now() - Date.parse(D.deals_asof) < DEAL_TTL);
const dealsOf = c => dealsLive() ? c.deals : [];

/* the scorecard of one card (D108): every later eBay sale against the value we published the week before */
function scoreOf(c, g) {
  const P = D.params || {}, se = P.sigma_e || 0.1, sq = P.sigma_q || 0.07, h = g.history || [];
  const out = [];
  for (const s of (c.sales || [])) {
    if (s.grade !== g.grade || s.pgen < 0.5 || s.venue !== "eBay") continue;
    let r = null; for (const x of h) { if (x[0] <= s.date) r = x; else break; }
    if (!r || r[0] === s.date) continue;
    const sd = (Math.log(r[3]) - Math.log(r[2])) / 2.5632, band = 1.2816 * Math.sqrt(sd * sd + se * se + sq * sq);
    out.push({date: s.date, price: s.price, value: r[1], lo: r[1] * Math.exp(-band), hi: r[1] * Math.exp(band), err: Math.abs(Math.log(s.price / r[1]))});
  }
  return out;
}
/* D120: the scorecard answers one plain question, "can you trust this price?", not "is it a good buy" */
function trustOf(L) {
  const inside = L.filter(x => x.price >= x.lo && x.price <= x.hi).length, share = inside / L.length;
  const errs = L.map(x => x.err).sort((a, b) => a - b), med = Math.exp(errs[Math.floor(errs.length / 2)]) - 1;
  const lvl = med <= 0.10 && share >= 0.7 ? "hi" : med <= 0.20 && share >= 0.6 ? "mid" : "lo";
  return {inside, share, med, lvl};
}

    <p class="muted">${tx(`<b>${T.inside} vendite su ${L.length}</b> sono finite vicino al prezzo che avevamo scritto qui la settimana prima.`, `<b>${T.inside} of ${L.length} sales</b> landed close to the price we had written here the week before.`)}

(function () {
