# When the site build or a collection fails, open an issue (D110): the owner gets a notification by email.
name: Avvisi
on:
  workflow_run:
    workflows: ["Sito", "Raccolta tcgcharts", "Raccolta Alt", "Occasioni"]
    types: [completed]
permissions:
  issues: write
jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ github.event.workflow_run.name }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "Non riuscito: $NAME ($(date -u +%F))" --body "Il workflow \"$NAME\" non è andato a buon fine. Dettagli: $URL"
