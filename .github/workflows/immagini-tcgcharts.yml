# D298: the card images we cannot get elsewhere, from tcgcharts (Marek's permission), one request every 3 seconds.
# Same queue as the tcgcharts collection, so the two never run at the same time.
name: Immagini tcgcharts
on:
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: raccolta-tcgcharts
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Guard bot commits (no conflict markers, valid JSON)
        run: git config core.hooksPath .githooks
      - name: Private data (D163)
        uses: ./.github/actions/private-data
        with:
          mode: pull
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Images
        run: |
          pip install -q pillow
          TC_BUDGET_MIN=80 python scripts/fetch_missing_images.py --tcgcharts
      - name: Save and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "slabwise-bot"
          git config user.email "slabwise-bot@users.noreply.github.com"
          git add prototype/data/images.json prototype/data/hires.json prototype/data/cards_ja.json
          git diff --cached --quiet && exit 0
          git commit -m "Immagini da tcgcharts (D298)"
          git pull --rebase -q && git push
          gh workflow run sito.yml --ref main
