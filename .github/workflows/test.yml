name: Test
# The tests at every change (CLAUDE.md rule 5 was by hand until 11 Nov 2026). A failure opens a red mark on the commit
# and GitHub notifies the owner.
on:
  push:
    branches: [main]
    paths: ["slabwise/**", "scripts/**", "prototype/**", "tests/**", "functions/**", ".github/workflows/test.yml"]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q numpy scipy pandas pillow pytest
      - run: python -m pytest -q tests
