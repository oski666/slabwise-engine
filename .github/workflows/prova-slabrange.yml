# Protocol §61b (D294): the SlabRange as the real 8-in-10 of each card x grade (Q, Q2) against the site's band (A). Runs on GitHub's machines.
name: Prova SlabRange
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Guard bot commits (no conflict markers, valid JSON)
        run: git config core.hooksPath .githooks
      - name: Private data (D163)
        uses: ./.github/actions/private-data
        with:
          mode: pull
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calibration cache (D228)
        uses: actions/cache@v4
        with:
          path: ~/.cache/slabwise/calib
          key: calib-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: calib-
      - name: Test
        run: |
          pip install -q numpy pandas scipy
          PYTHONPATH=. python scripts/slabrange_q_test.py /tmp/sr | tee /tmp/sr.txt
      - name: Keep the scored sales of the sample (reused by the next SlabRange tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slabrange-rows-A
          path: /tmp/sr/rows_A.csv
          retention-days: 30
      - name: Save
        if: always()
        run: |
          git config user.name "slabwise-bot"
          git config user.email "slabwise-bot@users.noreply.github.com"
          git add results/slabrange || true
          git diff --cached --quiet || { git commit -m "Prova SlabRange (§61): risultati"; git pull --rebase --autostash -q && git push; }
