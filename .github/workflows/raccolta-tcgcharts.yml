# Collection from tcgcharts (D76, D77, D89), on GitHub's own machines: it does not use Claude.
# Every day the newest page of sales of the cards and grades that are due (one request every 2 seconds, D297, D321),
# in four quarters (this morning run and three from Occasioni, D323);
# on Mondays first the new cards and the PSA populations. Each part stops in time to save what it got.
name: Raccolta tcgcharts
on:                               # D116: started by the Cloudflare clock (orologio/worker.js)
  workflow_dispatch: {}
  workflow_call:                  # D323: a quarter of the day's collection, from Occasioni, three more times a day
    inputs:
      quarter:
        type: boolean
        default: true
    secrets:
      DATA_TOKEN:
        required: true
permissions:
  contents: write
  actions: write                  # restart of the Japanese checks
jobs:
  tcgcharts:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    concurrency:                  # D323: at job level. 18 Nov: the quarter called by Occasioni has its own queue: in the shared
      # one a waiting quarter was replaced by the next Japanese check and the whole Occasioni run was cancelled (11:23 UTC);
      # so at most two tcgcharts jobs at once, at 2 s a request each: one request a second in all (D321)
      group: ${{ inputs.quarter && 'raccolta-quarto' || 'raccolta-tcgcharts' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # a run that waited in the queue starts from the latest commit, not the one it was queued on
      - name: Guard bot commits (no conflict markers, valid JSON)
        run: git config core.hooksPath .githooks
      - name: Private data (D163)
        uses: ./.github/actions/private-data
        with:
          mode: pull
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calibration cache (D228)
        uses: actions/cache@v4
        with:
          path: ~/.cache/slabwise/calib
          key: calib-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: calib-
      - name: Collect
        run: |
          mkdir -p /tmp/tc
          cp data/raw/tcgcharts/sales.json /tmp/tc/old_sales.json 2>/dev/null || true
          # D297: both parts stop in time (the job has 90 minutes): on Mondays 25 minutes of map and populations, then
          # the newest sales of the cards and grades that are due for the rest of the time
          # D323: the day's 70 minutes in four quarters of 18 (this morning run and three from Occasioni)
          BUDGET=18
          if [ "${{ inputs.quarter }}" != "true" ] && [ "$(date -u +%u)" = "1" ]; then
            mkdir -p /tmp/tcw
            TC_BUDGET_MIN=25 PYTHONPATH=. python scripts/tcgcharts.py /tmp/tcw
            cp /tmp/tcw/cards.json data/raw/tcgcharts/cards.json
            python scripts/pop_history.py data/raw/tcgcharts/cards.json data/raw/tcgcharts/pop_history.json
            python scripts/tcgcharts_accumulate.py /tmp/tc/old_sales.json /tmp/tcw/sales.json /tmp/tc/old_sales.json
          fi
          TC_BUDGET_MIN=$BUDGET PYTHONPATH=. python scripts/tcgcharts.py /tmp/tc --recent
          python scripts/tcgcharts_accumulate.py /tmp/tc/old_sales.json /tmp/tc/sales.json data/raw/tcgcharts/sales.json
      - name: Card requests (D97)
        if: inputs.quarter != true
        continue-on-error: true
        timeout-minutes: 10
        run: |                   # 15 Nov: only the check; adding cards (engine gate, ~2 hours now) is left to Richieste
          PYTHONPATH=. python scripts/card_requests.py prototype/data/requests_status.json
      - name: Save
        run: |
          git config user.name "slabwise-bot"
          git config user.email "slabwise-bot@users.noreply.github.com"
          git add prototype/data/requests_status.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "tcgcharts: raccolta del $(date -u +%F)"
          git pull --rebase -q && git push
      - name: Save the private data (D163)
        uses: ./.github/actions/private-data
        with:
          mode: push
          token: ${{ secrets.DATA_TOKEN }}
          message: "tcgcharts: raccolta del giorno"
      - name: Restart the Japanese checks if their chain stopped (18 Nov 2026)
        if: inputs.quarter != true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the chain of "Prezzi giapponesi" (D284) stopped on 13 November when a waiting run was replaced in the shared
          # queue, and 1.776 Japanese printings waited five days unchecked: every morning, if cards are due and no
          # run is waiting or running, one is started
          left=$(python scripts/ja_due.py | wc -w)
          busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/prezzi-giapponesi.yml/runs?per_page=5" --jq '[.workflow_runs[]|select(.status!="completed")]|length')
          echo "giapponesi da controllare: $left; giri in corso o in attesa: $busy"
          if [ "$left" -gt 0 ] && [ "$busy" = "0" ]; then gh workflow run prezzi-giapponesi.yml -R "$GITHUB_REPOSITORY"; fi

