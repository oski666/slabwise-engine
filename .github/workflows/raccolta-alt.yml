# Daily collection of recent sales from Alt's public pages (D64, D73), on GitHub's own machines:
# it does not use Claude. Same script and limits as the manual run (scripts/alt_sold.py).
name: Raccolta Alt
on:
  workflow_dispatch: {}          # manual only since D89: tcgcharts gives the same eBay sales every day
permissions:
  contents: write
concurrency:
  group: raccolta-alt
  cancel-in-progress: false
jobs:
  alt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Private data (D163)
        uses: ./.github/actions/private-data
        with:
          mode: pull
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Collect
        run: PYTHONPATH=. python scripts/alt_sold.py data/raw/alt
      - name: Save
        run: |
          git config user.name "slabwise-bot"
          git config user.email "slabwise-bot@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Alt: raccolta del $(date -u +%F)"
          git pull --rebase -q && git push
      - name: Save the private data (D163)
        uses: ./.github/actions/private-data
        with:
          mode: push
          token: ${{ secrets.DATA_TOKEN }}
          message: "Alt: raccolta del giorno"
