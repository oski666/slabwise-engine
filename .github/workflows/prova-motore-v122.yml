# Protocol §57 (D260): the model's market groups = the site's eras (F), plus Japanese groups (G). Runs on GitHub's machines.
name: Prova motore v1.22
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Guard bot commits (no conflict markers, valid JSON)
        run: git config core.hooksPath .githooks
      - name: Private data (D163)
        uses: ./.github/actions/private-data
        with:
          mode: pull
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calibration cache (D228)
        uses: actions/cache@v4
        with:
          path: ~/.cache/slabwise/calib
          key: calib-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: calib-
      - name: Test
        run: |
          pip install -q numpy pandas scipy
          PYTHONPATH=. python scripts/engine_v122_test.py /tmp/v122 | tee /tmp/v122.txt
      - name: Save
        if: always()
        run: |
          git config user.name "slabwise-bot"
          git config user.email "slabwise-bot@users.noreply.github.com"
          git add results/v122 || true
          git diff --cached --quiet || { git commit -m "Prova motore v1.22 (§57): risultati"; git pull --rebase --autostash -q && git push; }
