# D228 check, one-off: the old sequence (two engine runs, no calibration cache) and the new one (one run, cache
# cold and then warm) must give the same real.json. Runs on the branch only; removed after adoption.
name: Verifica D228
on:
  push:
    branches: [d228-veloce]
  workflow_dispatch: {}
jobs:
  run:
    strategy:
      matrix:
        arm: [old, new]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Private data (D163)
        uses: ./.github/actions/private-data
        with:
          mode: pull
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pandas pillow
      - name: Sales
        run: SLABWISE_TC_HISTORY=1 PYTHONPATH=. python scripts/build_sales.py data/raw/sales_base.csv data/raw/alt data/raw/sales_all.csv data/raw/tcgcharts
      - name: Old sequence (no cache)
        if: matrix.arm == 'old'
        env:
          SLABWISE_CALIB_CACHE: "0"
        run: |
          mkdir -p /tmp/res
          s=$(date +%s)
          SLABWISE_TC_HISTORY=1 SLABWISE_OUT=/tmp/real_hist.json PYTHONPATH=. python prototype/build_real_data.py data/raw/sales_all.csv data/raw/era_map.json
          PYTHONPATH=. python scripts/index_full_extract.py /tmp/real_hist.json
          if [ -f data/raw/gemrate/sets.json ]; then PYTHONPATH=. python scripts/gemrate_tap.py data/raw/gemrate/sets.json data/raw/sales_all.csv data/raw/gemrate/tap.json; fi
          PYTHONPATH=. python prototype/build_real_data.py data/raw/sales_all.csv data/raw/era_map.json
          echo "old $(( $(date +%s) - s )) s" | tee /tmp/res/time_old.txt
          cp prototype/data/real.json /tmp/res/real_old.json
      - name: New sequence (cache cold, then warm)
        if: matrix.arm == 'new'
        run: |
          mkdir -p /tmp/res
          if [ -f data/raw/gemrate/sets.json ]; then PYTHONPATH=. python scripts/gemrate_tap.py data/raw/gemrate/sets.json data/raw/sales_all.csv data/raw/gemrate/tap.json; fi
          s=$(date +%s)
          SLABWISE_TC_HISTORY=1 SLABWISE_INDEX_SELF=1 PYTHONPATH=. python prototype/build_real_data.py data/raw/sales_all.csv data/raw/era_map.json
          echo "new cold $(( $(date +%s) - s )) s" | tee /tmp/res/time_new.txt
          cp prototype/data/real.json /tmp/res/real_new_cold.json
          s=$(date +%s)
          SLABWISE_TC_HISTORY=1 SLABWISE_INDEX_SELF=1 PYTHONPATH=. python prototype/build_real_data.py data/raw/sales_all.csv data/raw/era_map.json
          echo "new warm $(( $(date +%s) - s )) s" | tee -a /tmp/res/time_new.txt
          cp prototype/data/real.json /tmp/res/real_new_warm.json
      - uses: actions/upload-artifact@v4
        with:
          name: res-${{ matrix.arm }}
          path: /tmp/res
          retention-days: 3
  compare:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/res
          merge-multiple: true
      - run: cat /tmp/res/time_*.txt
      - run: python scripts/same_json.py /tmp/res/real_old.json /tmp/res/real_new_cold.json /tmp/res/real_new_warm.json
