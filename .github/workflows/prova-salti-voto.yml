# Protocol §37 (D206): history in the prices, review on recent sales, jumps of a single grade. Runs on GitHub's machines.
name: Prova salti di voto
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Guard bot commits (no conflict markers, valid JSON)
        run: git config core.hooksPath .githooks
      - name: Private data (D163)
        uses: ./.github/actions/private-data
        with:
          mode: pull
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install -q numpy pandas scipy
          PYTHONPATH=. python scripts/grade_jump_test.py /tmp/gradejump | tee /tmp/gradejump.txt
      - name: Save
        if: always()
        run: |
          git config user.name "slabwise-bot"
          git config user.email "slabwise-bot@users.noreply.github.com"
          git add results/gradejump || true
          git diff --cached --quiet || { git commit -m "Prova salti di voto (§37): risultati"; git pull --rebase --autostash -q && git push; }
