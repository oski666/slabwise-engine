# One-week measurement of deals among NEW eBay listings (D114), 2 to 9 November 2026: finished (results in D247).
# The Cloudflare clock may still start this workflow until the worker is redeployed from orologio/worker.js:
# it now does nothing and ends green, so it never shows as a failure.
name: Misura occasioni
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ended:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "Misura conclusa il 9 novembre 2026 (D114, D247), niente da fare."
