# Protocol §31 (D167): basket size of the indices, 10/15/20 per era and 30/60 for the general index.
name: Prova indici
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Guard bot commits (no conflict markers, valid JSON)
        run: git config core.hooksPath .githooks
      - name: Private data (D163)
        uses: ./.github/actions/private-data
        with:
          mode: pull
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install -q numpy pandas scipy pillow
          PYTHONPATH=. python scripts/index_k_test.py /tmp/ik 2>&1 | grep -v Warning
      - name: Save
        run: |
          git config user.name "slabwise-bot"
          git config user.email "slabwise-bot@users.noreply.github.com"
          git add results/index_k/summary.json
          git diff --cached --quiet || { git commit -m "Prova §31: numero di voci del paniere"; git pull --rebase --autostash -q && git push; }
