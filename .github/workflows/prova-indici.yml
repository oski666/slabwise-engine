# Protocol §54 (D253): Contemporanea in two eras. (Before: §53, D251, Japanese index with seats per era.) (Before: §51, D245, general index; §31, D167, basket sizes.)
# (Earlier: protocol §31, D167, basket sizes; results in results/index_k/.)
name: Prova indici
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: Guard bot commits (no conflict markers, valid JSON)
        run: git config core.hooksPath .githooks
      - name: Private data (D163)
        uses: ./.github/actions/private-data
        with:
          mode: pull
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sales
        run: |
          pip install -q numpy pandas scipy pillow
          SLABWISE_TC_HISTORY=1 PYTHONPATH=. python scripts/build_sales.py data/raw/sales_base.csv data/raw/alt data/raw/sales_all.csv data/raw/tcgcharts
      - name: Calibration cache (D228)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/slabwise/calib
          key: calib-none
          restore-keys: calib-
      - name: Test
        run: |
          SLABWISE_ERA_SPLIT_TEST=1 SLABWISE_TC_HISTORY=1 SLABWISE_INDEX_SELF=1 PYTHONPATH=. python prototype/build_real_data.py data/raw/sales_all.csv data/raw/era_map.json | grep -E "^cards"
          python scripts/era_split_test.py results/era_split/series.json
      - name: Save
        run: |
          git config user.name "slabwise-bot"
          git config user.email "slabwise-bot@users.noreply.github.com"
          git add results/era_split/summary.json results/era_split/series.json
          git diff --cached --quiet || { git commit -m "Prova §54: la Contemporanea in due ere"; git pull --rebase --autostash -q && git push; }
