# Protocol §58 (D263): 20, 30 or 40 items per era index. (Before: §54, D253, Contemporanea in two eras; §53, D251, Japanese index with seats per era.) (Before: §51, D245, general index; §31, D167, basket sizes.)
# (Earlier: protocol §31, D167, basket sizes; results in results/index_k/.)
name: Prova indici
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Guard bot commits (no conflict markers, valid JSON)
        run: git config core.hooksPath .githooks
      - name: Private data (D163)
        uses: ./.github/actions/private-data
        with:
          mode: pull
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sales
        run: |
          pip install -q numpy pandas scipy pillow
          SLABWISE_TC_HISTORY=1 PYTHONPATH=. python scripts/build_sales.py data/raw/sales_base.csv data/raw/alt data/raw/sales_all.csv data/raw/tcgcharts
      - name: Calibration cache (D228)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/slabwise/calib
          key: calib-none
          restore-keys: calib-
      - name: Test
        run: |
          mkdir -p /tmp/ixk && cp data/raw/sales_all.csv /tmp/ixk/sales_hist.csv
          VARIANTS=K20:20:60,K30:30:60,K40:40:60 OUTDIR=index_k58 PYTHONPATH=. python scripts/index_k_test.py /tmp/ixk
      - name: Save
        run: |
          git config user.name "slabwise-bot"
          git config user.email "slabwise-bot@users.noreply.github.com"
          git add results/index_k58/summary.json
          git diff --cached --quiet || { git commit -m "Prova §58: panieri da 20, 30 o 40 voci"; git pull --rebase --autostash -q && git push; }
