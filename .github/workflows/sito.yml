# Automatic site build (D75, D112): every morning, after the sales collection, GitHub recomputes the values, reads the
# active eBay listings, computes the deals and publishes the page on Cloudflare Pages. It does not use Claude.
# The deals are refreshed during the day by the "Occasioni" workflow, which reuses this run's values (artifact).
# eBay listings are never committed (no archive, licence §8.1): they live only inside the run.
name: Sito
on:
  workflow_run:                  # D116: right after the morning collection, whenever GitHub actually runs it
    workflows: ["Raccolta tcgcharts"]
    types: [completed]
  schedule:
    - cron: "17 9 * * *"           # fallback: if the collection never ran, build anyway (skipped when today's build exists)
  workflow_dispatch: {}
  push:                          # D199, D202: a change to the site, the engine or a character image rebuilds the site by itself
    branches: [main]
    paths: ["prototype/character/**", "prototype/v7/**", "prototype/build_real_data.py", "slabwise/**", "functions/**", "social/reel-studio/**", "prototype/data/curiosita.json"]
permissions:
  contents: write                # D105: the weekly sealed snapshot is committed
concurrency:
  group: deploy-${{ github.ref_name }}    # D230: a preview of a branch never waits for (or blocks) the live site
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sito.yml/runs?created=>=$(date -u +%F)&status=success" -q '.total_count')
            [ "$n" -gt 0 ] && go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150            # D227: a slow day never leaves the site without values
    env:
      HAS_EBAY: ${{ secrets.EBAY_CLIENT_ID != '' }}
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard bot commits (no conflict markers, valid JSON)
        run: git config core.hooksPath .githooks
      - name: Private data (D163)
        uses: ./.github/actions/private-data
        with:
          mode: pull
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install numpy scipy pandas pillow
      - name: Keys
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EPN_CAMPAIGN_ID: ${{ secrets.EPN_CAMPAIGN_ID }}
        run: |
          mkdir -p ~/.slabwise
          printf '%s' "$EBAY_CLIENT_ID" > ~/.slabwise/ebay_client_id
          printf '%s' "$EBAY_CLIENT_SECRET" > ~/.slabwise/ebay_client_secret
          printf '%s' "$EPN_CAMPAIGN_ID" > ~/.slabwise/epn_campaign_id
      - name: Sales (base + Alt + tcgcharts with the long history, D82, D210)
        run: SLABWISE_TC_HISTORY=1 PYTHONPATH=. python scripts/build_sales.py data/raw/sales_base.csv data/raw/alt data/raw/sales_all.csv data/raw/tcgcharts
      - name: The tap from the GemRate reads (D190)
        continue-on-error: true
        run: |
          if [ -f data/raw/gemrate/sets.json ]; then PYTHONPATH=. python scripts/gemrate_tap.py data/raw/gemrate/sets.json data/raw/sales_all.csv data/raw/gemrate/tap.json; fi
      - name: Calibration cache (D228)
        uses: actions/cache@v4
        with:
          path: ~/.cache/slabwise/calib
          key: calib-${{ github.run_id }}
          restore-keys: calib-
      - name: Values and indices with the long history in one run (D149, D228)
        run: |
          SLABWISE_TC_HISTORY=1 SLABWISE_INDEX_SELF=1 PYTHONPATH=. python prototype/build_real_data.py data/raw/sales_all.csv data/raw/era_map.json
          mkdir -p /tmp/out && cp prototype/data/real.json /tmp/out/real.json   # D227: the values of this run, kept apart from git
      - name: Coherence checks (D211)
        continue-on-error: true
        run: PYTHONPATH=. python scripts/coherence_check.py prototype/data/real.json results/coherence.json
      - name: eBay listings and deals (D112)
        if: env.HAS_EBAY == 'true'
        continue-on-error: true
        timeout-minutes: 10              # a slow eBay never blocks the publication of the values
        run: |
          PYTHONPATH=. python scripts/ebay_listings.py data/raw/ebay/listings.json
          PYTHONPATH=. python scripts/deals_refresh.py prototype/data/real.json data/raw/ebay/listings.json
      - name: Keep the values with the deals (D227)
        run: cp prototype/data/real.json /tmp/out/real.json
      - name: Weekly sealed snapshot (D105)
        if: github.ref_name == 'main'     # D230: a preview never commits
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q opentimestamps-client
          python scripts/seal.py /tmp/out/real.json data/seals
          for f in data/seals/*.json; do [ -f "$f.ots" ] || ots stamp "$f"; done
          ots upgrade data/seals/*.ots || true
          # D227: commit in a separate clone, so a conflict can never touch the values about to be published
          rm -rf /tmp/pub && git clone -q --depth 50 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pub
          mkdir -p /tmp/pub/data/seals /tmp/pub/results && cp -a data/seals/. /tmp/pub/data/seals/
          cp prototype/data/pulse.json /tmp/pub/prototype/data/pulse.json 2>/dev/null || true
          cp results/coherence.json /tmp/pub/results/coherence.json 2>/dev/null || true
          cd /tmp/pub
          git config user.name "slabwise-bot"
          git config user.email "slabwise-bot@users.noreply.github.com"
          git config core.hooksPath .githooks
          git add data/seals prototype/data/pulse.json results/coherence.json   # D184: the stories of the week; D211: the coherence report
          git diff --cached --quiet || { git commit -q -m "Istantanea sigillata dei valori" && for k in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done; }
      - name: Scorecard (D105)
        continue-on-error: true
        run: PYTHONPATH=. python scripts/pagella.py data/raw/sales_all.csv prototype/data/pagella.json
      - name: Keep the values for the deal refreshes
        if: github.ref_name == 'main'     # D230: the deal refreshes only ever see the live values
        uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: |
            prototype/data/real.json
            prototype/data/pagella.json
          retention-days: 3
      - name: Page
        run: |
          cp /tmp/out/real.json prototype/data/real.json      # D227: always the values of this run
          python - <<'PY'
          import json, sys, datetime as dt
          D = json.load(open("prototype/data/real.json"))
          age = (dt.date.today() - dt.date.fromisoformat(D["asof"][:10])).days
          if len(D["cards"]) < 100 or age > 3:                # D227: never publish old or partial values
              sys.exit(f"Valori non pubblicabili: {len(D['cards'])} carte, dati di {age} giorni fa")
          print("valori da pubblicare:", len(D["cards"]), "carte, del", D["asof"])
          PY
          mkdir -p site
          python prototype/v7/build.py real --split site
          sed -i 's#<meta charset="utf-8">#<meta charset="utf-8">\n<meta name="robots" content="noindex">#' site/index.html
          python social/reel-studio/build.py site
          sed 's#<meta charset="utf-8">#<meta charset="utf-8">\n<meta name="robots" content="noindex">#' social/reel-studio/studio.html > site/x/studio.html
      - name: Publish on Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        if: env.HAS_CF == 'true'
        run: |
          npx --yes wrangler@3 pages project create slabwise --production-branch=main || true
          npx --yes wrangler@3 pages deploy site --project-name=slabwise --branch=${{ github.ref_name }} --commit-dirty=true   # D230: main = live site, any other branch = preview at <branch>.slabwise.pages.dev
